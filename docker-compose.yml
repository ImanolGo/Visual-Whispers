# docker compose up --build                  -> http://localhost:8000
# docker compose --profile share up --build  -> also opens a public ngrok tunnel (URL at http://localhost:4040)
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - whispers-data:/data   # generated images and shared chains survive restarts
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["share"]
    command: http app:8000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env to share publicly}
    ports:
      - "4040:4040"
    depends_on:
      - app

volumes:
  whispers-data:
